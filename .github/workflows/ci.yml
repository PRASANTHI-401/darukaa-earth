name: Darukaa.Earth CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install System Geospatial Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 black pytest httpx

    - name: Run Flake8 Linting
      run: |
        # Stop build if syntax errors or undefined names exist
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warning checks
        flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run Black Code Formatting Check
      run: |
        black --check backend/app backend/tests

    - name: Run Backend Unit Tests
      run: |
        cd backend
        pytest -v

  frontend-quality-and-build:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Check Prettier Formatting
      run: |
        cd frontend
        npx prettier --check "src/**/*.{js,jsx,css,json}"

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint

    - name: Verify Production Build
      run: |
        cd frontend
        npm run build
