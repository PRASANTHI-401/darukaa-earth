version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: darukaa_postgis
    environment:
      POSTGRES_USER: darukaa_user
      POSTGRES_PASSWORD: darukaa_password
      POSTGRES_DB: darukaa_earth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darukaa_user -d darukaa_earth"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: darukaa_backend
    environment:
      DATABASE_URL: postgresql://darukaa_user:darukaa_password@db:5432/darukaa_earth
      JWT_SECRET: darukaa-super-secret-production-jwt-key-2024
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: darukaa_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  pgdata:
